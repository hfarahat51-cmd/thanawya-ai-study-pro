<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - Thanawya AI Study Pro</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      width: 360px;
      max-width: 90%;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 8px;
      color: #111827;
    }

    p {
      color: #555;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #2563eb;
    }

    #message {
      min-height: 20px;
      margin-top: 15px;
      color: #b91c1c;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Thanawya AI Study Pro</h2>
  <p>ادخل بالإيميل والباسورد</p>

  <input id="email" type="email" placeholder="الإيميل" />
  <input id="password" type="password" placeholder="الباسورد" />

  <button onclick="login()">دخول</button>
  <button class="secondary" onclick="signup()">إنشاء حساب جديد</button>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/*
  مهم:
  غير السطرين دول ببيانات مشروع Supabase بتاعك.
  هتلاقيهم في:
  Supabase > Project Settings > API
*/
const SUPABASE_URL = "https://xxxxxxxxxxxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIs...";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

function showMessage(text) {
  document.getElementById("message").innerText = text;
}

async function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("اكتب الإيميل والباسورد");
    return;
  }

  const { error } = await supabase.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("تم إنشاء الحساب. انتظر تفعيل الاشتراك من الإدارة.");
  }
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("اكتب الإيميل والباسورد");
    return;
  }

  const { error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    showMessage("الإيميل أو الباسورد غير صحيح");
  } else {
    window.location.href = "index.html";
  }
}
</script>

</body>
</html>
