<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thanawya AI Study Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      overflow: hidden;
    }

    header {
      height: 64px;
      background: #111827;
      color: white;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 16px;
    }

    .badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: white;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logout {
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .message {
      max-width: 720px;
      margin: 48px auto;
      background: white;
      padding: 28px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(17,24,39,0.10);
      line-height: 1.8;
    }

    .message h2 {
      margin-top: 0;
      color: #111827;
    }

    .message p {
      color: #4b5563;
      white-space: pre-line;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
      display: none;
      background: white;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="badge">AI</div>
    <span>Thanawya AI Study Pro</span>
  </div>

  <button class="logout" onclick="logout()">تسجيل خروج</button>
</header>

<div id="statusBox" class="message">
  <h2>جاري التحميل...</h2>
  <p>يتم الآن التحقق من الحساب والاشتراك والجهاز.</p>
</div>

<iframe id="pdfViewer"></iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ضع بيانات Supabase هنا */
const SUPABASE_URL = "https://jbwqvlssznqldgobhfrz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impid3F2bHNzem5xbGRnb2JoZnJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjcxNTcsImV4cCI6MjA5NTQwMzE1N30.FgZHutH0GbXjM4fhhN7JgfIBZKL6PzjSzflGb8nK8-Q";

/*
  إعدادات PDF
  لو index-debug قالك مسار PDF مختلف، غيّر PDF_PATH هنا.
*/
const PDF_BUCKET = "course-files";
const PDF_PATH = "thanawya-study-pro.pdf";

let supabaseClient = null;

function showMessage(title, text) {
  const box = document.getElementById("statusBox");
  box.style.display = "block";
  box.innerHTML = "<h2>" + title + "</h2><p>" + text + "</p>";
}

function getDeviceId() {
  let deviceId = localStorage.getItem("thanawya_device_id");

  if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("thanawya_device_id", deviceId);
  }

  return deviceId;
}

function initSupabase() {
  if (!window.supabase) {
    showMessage("تعذر تحميل النظام", "تأكد من اتصال الإنترنت ثم أعد فتح الصفحة.");
    return false;
  }

  if (SUPABASE_URL.includes("PUT_YOUR") || SUPABASE_ANON_KEY.includes("PUT_YOUR")) {
    showMessage("بيانات الاتصال غير مكتملة", "تواصل مع إدارة المنصة.");
    return false;
  }

  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}

async function protectPage() {
  if (!initSupabase()) return;

  const userResult = await supabaseClient.auth.getUser();

  if (userResult.error || !userResult.data.user) {
    window.location.href = "login.html";
    return;
  }

  const accessResult = await supabaseClient.rpc("check_access_one_device", {
    p_device_id: getDeviceId(),
    p_user_agent: navigator.userAgent
  });

  if (accessResult.error) {
    showMessage("حدث خطأ في التحقق", "أعد المحاولة أو تواصل مع إدارة المنصة.");
    return;
  }

  const access = accessResult.data;

  if (!access || access.allowed !== true) {
    if (access && access.reason === "subscription_not_active") {
      window.location.href = "subscribe.html";
      return;
    }

    if (access && access.reason === "another_device_detected") {
      showMessage(
        "تم رفض الدخول",
        "هذا الحساب مربوط بجهاز آخر.\nتواصل مع الإدارة لتغيير الجهاز."
      );
      return;
    }

    window.location.href = "login.html";
    return;
  }

  await loadPDF();
}

async function createSignedUrlForPath(path) {
  return await supabaseClient
    .storage
    .from(PDF_BUCKET)
    .createSignedUrl(path, 120);
}

async function findFirstPdfInBucket() {
  const listResult = await supabaseClient
    .storage
    .from(PDF_BUCKET)
    .list("", {
      limit: 100,
      offset: 0,
      sortBy: { column: "name", order: "asc" }
    });

  if (listResult.error || !listResult.data) return null;

  const pdfFile = listResult.data.find(function (item) {
    return item.name && item.name.toLowerCase().endsWith(".pdf");
  });

  if (!pdfFile) return null;
  return pdfFile.name;
}

async function loadPDF() {
  showMessage("جاري فتح المحتوى...", "برجاء الانتظار.");

  let signedResult = await createSignedUrlForPath(PDF_PATH);

  if (signedResult.error || !signedResult.data || !signedResult.data.signedUrl) {
    const fallbackPath = await findFirstPdfInBucket();

    if (fallbackPath) {
      signedResult = await createSignedUrlForPath(fallbackPath);
    }
  }

  if (signedResult.error || !signedResult.data || !signedResult.data.signedUrl) {
    showMessage(
      "تعذر فتح المحتوى",
      "حسابك مفعل، لكن لم يتم العثور على ملف المحتوى.\nتواصل مع إدارة المنصة."
    );
    return;
  }

  document.getElementById("statusBox").style.display = "none";

  const viewer = document.getElementById("pdfViewer");
  viewer.style.display = "block";
  viewer.src = signedResult.data.signedUrl + "#toolbar=0";
}

async function logout() {
  if (!supabaseClient && window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  if (supabaseClient) {
    await supabaseClient.auth.signOut();
  }

  window.location.href = "login.html";
}

protectPage();
</script>

</body>
</html>
